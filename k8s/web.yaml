apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ajs-web
  template:
    metadata:
      labels:
        app: ajs-web
    spec:
      containers:
        - name: web
          image: ajs-suite-web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector:
    app: ajs-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
