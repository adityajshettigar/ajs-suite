networks:
  ajs:
    external: true

services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "8001"
    volumes:
      - admin_sessions:/var/lib/ajs-admin/sessions
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ajs

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      admin:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ajs

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - ajs
    depends_on:
      - web

  # --- Monitoring Stack ---

  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.external-url=https://ajs-suite.${DOMAIN}/prometheus/'
      - '--web.route-prefix=/prometheus/'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ajs
    restart: unless-stopped
    # NO ports exposed — reachable via Grafana datasource only

  node-exporter:
    image: prom/node-exporter:latest
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - ajs
    restart: unless-stopped
    # NO ports exposed

  grafana:
    image: grafana/grafana-oss:latest
    environment:
      GF_SERVER_ROOT_URL: https://ajs-suite.${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - ajs
    restart: unless-stopped
    # NO ports exposed — reachable via subpath behind nginx


# --- ELK Stack (Elasticsearch + Logstash + Kibana + Filebeat)
# WARNING: This is HEAVY. Elasticsearch needs >= 2 GB RAM minimum.
# t3.micro cannot run ELK. t3.large (8 GB) is the minimum recommended.
# On t3.medium, consider dropping the ELK block entirely.
#
# To disable ELK, comment out the following four services and their volume declarations.

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock: {soft: -1, hard: -1}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ajs
    restart: unless-stopped
    # NO ports exposed

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    networks:
      - ajs
    depends_on:
      - elasticsearch
    restart: unless-stopped
    # NO ports exposed

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    environment:
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
      - SERVER_PUBLICBASEURL=https://${DOMAIN}/kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - ajs
    depends_on:
      - elasticsearch
    restart: unless-stopped
    # NO ports exposed — reachable via nginx subpath with basic auth

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    user: root
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ajs
    depends_on:
      - logstash
    restart: unless-stopped
    # NO ports exposed

# Kibana basic auth htpasswd file
# Generated by ansible/site.yml: htpasswd -cb docker/nginx/.htpasswd ${KIBANA_USER} ${KIBANA_PASSWORD}
# Mounted into nginx below

# Nginx Kibana route (see docker/nginx/default.conf)

# NOTE: If downgrading to t3.medium, comment out the entire ELK block above
# and the associated nginx route. ELK will OOM on less than 4 GB RAM.

volumes:
  admin_sessions:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
  logstash_data:
  kibana_data:
