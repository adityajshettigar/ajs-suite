services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "8001"
    volumes:
      - admin_sessions:/var/lib/ajs-admin/sessions
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/admin/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8086}:80"
    depends_on:
      admin:
        condition: service_healthy
    restart: unless-stopped

volumes:
  admin_sessions:
