# AJS Suite Ansible Vault — Secrets Management
# 
# This file documents where secrets should be stored. You have two options:
#
# Option A: Use Ansible Vault (recommended for production)
# 1. Create an encrypted vault:
#    ansible-vault create ansible/group_vars/web/vault.yml
# 2. Add the following keys (replace placeholder values):
#    CLOUDFLARE_TUNNEL_TOKEN: <your-token>
#    GOOGLE_CLIENT_ID: <id>.apps.googleusercontent.com
#    GOOGLE_CLIENT_SECRET: <secret>
#    ADMIN_EMAILS: you@example.com,other@example.com
#    GRAFANA_ADMIN_PASSWORD: <strong-password>
#    KIBANA_PASSWORD: <strong-password>
#    JIRA_BASE_URL: https://your-org.atlassian.net
#    JIRA_EMAIL: you@example.com
#    JIRA_API_TOKEN: <your-api-token>
#    JIRA_PROJECT_KEY: AJS
#    JIRA_WEBHOOK_SECRET: <random-secret>
#    SECRET_KEY: <32-random-bytes>
#
# 3. Run the playbook with the vault password:
#    ansible-playbook -i ansible/inventory.ini --ask-vault-pass ansible/site.yml
#
# Option B: Use a .env file on the controller (less secure, simpler)
# 1. Keep a .env file on your laptop with the same variables listed above
# 2. The playbook reads .env from the controller node (or the target if accessible)
# 3. Run the playbook normally:
#    ansible-playbook -i ansible/inventory.ini ansible/site.yml
#
# README note: "You need either the vault password or a populated .env on the
# controller to run the playbook."
#
# !!! NEVER commit real secrets to this file or any git repo !!!
# This file is gitignored. Use ansible-vault for production deployments.