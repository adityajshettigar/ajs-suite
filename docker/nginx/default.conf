server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Public portfolio — static files
    location / {
        try_files $uri $uri/ =404;
    }

    # /admin → /admin/
    location = /admin {
        return 301 /admin/;
    }

    # Admin app proxy
    location ^~ /admin/ {
        proxy_pass http://admin:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Health check (used by compose + Ansible)
    location = /health {
        proxy_pass http://admin:8001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Jira webhook receiver
    location = /webhooks/jira {
        proxy_pass http://admin:8001/webhooks/jira;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Block public access to /metrics — Prometheus scrapes internal only
    location = /metrics {
        return 404;
    }

    # Grafana subpath
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Kibana subpath — ENABLE once ELK is up and .htpasswd exists.
    # Currently disabled because .htpasswd does not exist yet.
    # location /kibana/ {
    #     auth_basic "Kibana";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #     proxy_pass http://kibana:5601/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }
}
